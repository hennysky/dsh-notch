- insert:
    - id: notch-balance
      name: 'dsh-plugin-notch-balance'
      config:
        appPath: /Applications/DSHNotch.app
        quitOnUnload: false
        notify: true
        bridgePort: 47810
        notifyAborted: false
        notifyTaskDone: true
        notifyAttention: true
        # Windows 后端优先级：auto = 托盘应用 → Electron → PowerShell toast
        notifyBackend: auto
        # 托盘应用路径；留空自动探测 %LOCALAPPDATA%\Programs\DSHNotch\DSHNotch.exe
        windowsAppPath: ''
        # 当前会话花费：写 ~/.dsh/notch/session-cost.json，供 DSHNotch 卡片读取
        sessionCost: true
        # 覆盖价目表（可选），形如 { 'deepseek-flash': { cacheHit: 0.04, cacheMiss: 2, output: 8 } }
        # sessionCostPricing: {}
        # 额外节假日（YYYY-MM-DD 数组），并入内置 2026 表
        # sessionCostHolidays: []
        # Token 用量日历：按天聚合所有会话的 token 与预估金额
        tokenActivity: true
        # 日历快照路径；留空 = ~/.dsh/notch/token-activity.json
        # tokenActivityFile: ''
        # 内部缓存路径；留空 = ~/.dsh/notch/token-activity-cache.json
        # tokenActivityCacheFile: ''
