name: Windows app

# Windows 托盘伴侣应用（windows/**）：编译 + 单测 + Release 发布。
# 这台开发机是 macOS 且没有 Windows，所以「能不能编译、测试过不过」由
# windows-latest 上的这个 workflow 给出结论。
on:
  push:
    branches:
      - windows-app
      - main
    paths:
      - 'windows/**'
      - '.github/workflows/windows-app.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

jobs:
  build-test-publish:
    name: build / test / publish (win-x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows/DSHNotch.Windows.sln

      - name: Build
        run: dotnet build windows/DSHNotch.Windows.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test windows/tests/DSHNotch.Tests/DSHNotch.Tests.csproj
          -c Release --no-build --no-restore
          --logger "console;verbosity=normal"

      - name: Publish (self-contained single file)
        run: >
          dotnet publish windows/src/DSHNotch/DSHNotch.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: List publish output
        run: Get-ChildItem publish | Format-Table Name, Length

      - name: Zip artifact
        run: Compress-Archive -Path publish/* -DestinationPath DSHNotch-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHNotch-win-x64
          path: DSHNotch-win-x64.zip
          retention-days: 14

      # 备用产物：不做 single-file 自解压，直接一个文件夹（exe + DLL）。
      # 单文件版在部分机器上会被杀软/SmartScreen 当成自解压程序拦下，
      # 这个版本用来排除「单文件自解压」这一类问题。
      - name: Publish folder (no single file)
        run: >
          dotnet publish windows/src/DSHNotch/DSHNotch.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -o publish-folder

      - name: Zip folder artifact
        run: Compress-Archive -Path publish-folder/* -DestinationPath DSHNotch-win-x64-folder.zip -Force

      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHNotch-win-x64-folder
          path: DSHNotch-win-x64-folder.zip
          retention-days: 14

      # 用户真正应该下载的东西：安装包。双击 → 下一步 → 直接启动，
      # 不需要解压 zip，也不会再遇到「是否解压缩此文件」。
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/DSHNotch.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DSHNotch-Setup
          path: dist-installer/DSHNotch-Setup-*.exe
          retention-days: 14

      # 便携版：单个 exe 直接下载就能跑（不需要 zip），给不想安装的用户。
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: DSHNotch-portable
          path: publish/DSHNotch.exe
          retention-days: 14
